[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jira-cloud-automation-shield"
version = "1.0.0"
description = "Two-Layer Pydantic Error Shield, FastMCP Gateway, and 4-Tier Operational Risk Firewall for Atlassian Jira Cloud REST API v3"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Mikhail Azhyshchev", email = "azhy34@users.noreply.github.com" }
]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "mcp>=1.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "requests-mock>=1.12.0"
]

[project.scripts]
jira-board = "controller.jira_board_cli:main"
